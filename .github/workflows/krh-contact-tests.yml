name: KRH Contact Worker Tests

on:
  pull_request:
    paths:
      - 'infrastructure/contact-worker/**'
      - '.github/workflows/krh-contact-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free Worker unit tests
        working-directory: infrastructure/contact-worker
        run: npm test
