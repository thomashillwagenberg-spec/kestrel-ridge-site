name: KRH publishing checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: krh-publishing-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reader feedback service
        run: node --test tests/reader-feedback/*.test.mjs tests/analytics/*.test.mjs
      - name: Validate reviewed sources and publishing gates
        run: |
          python3 -m unittest discover -s .growth -p 'test_*.py'
          python3 .growth/check.py
      - name: Check committed generated output
        run: |
          pip install -q beautifulsoup4
          python3 .growth/build.py
          python3 scripts/gen_markdown.py --check
          python3 scripts/check_slash_links.py
          git diff --exit-code
      - name: Post-build browser check (all sitemap URLs, local build)
        run: |
          npm install --no-save --no-package-lock playwright@1
          # Transient upstream apt mirror DNS failures (e.g. security.ubuntu.com)
          # have caused this step to fail for reasons unrelated to app code.
          # Retry with backoff before treating it as a real failure.
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium-headless-shell; then
              break
            fi
            echo "playwright install --with-deps failed (attempt $attempt/3), retrying after backoff..."
            if [ "$attempt" = "3" ]; then
              echo "playwright install failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
          python3 -m http.server 8830 -d . >/tmp/http.log 2>&1 &
          sleep 2
          node scripts/postbuild-check.mjs --base http://127.0.0.1:8830 --json /tmp/krh-postbuild.json
      - name: Verify deployed pages and assets
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 .growth/check.py --live --report /tmp/krh-publishing-report.json; then
              exit 0
            fi
            sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krh-publishing-report
          path: |
            /tmp/krh-publishing-report.json
            /tmp/krh-postbuild.json
          retention-days: 30
