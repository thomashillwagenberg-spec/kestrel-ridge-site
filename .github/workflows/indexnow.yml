name: Notify IndexNow

# Submits ONLY URLs whose content files changed in the triggering push.
# Logic lives in .github/scripts/indexnow_changed_urls.py.
# If sitemap.xml itself changed, all sitemap URLs are submitted.
# If no content files changed, nothing is submitted.
# Log: shows URLs submitted, HTTP response, and timestamp.

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute changed URLs and submit to IndexNow
        env:
          INDEXNOW_KEY: e2a76b4686264f2f9418b07705154e24
        run: |
          set -euo pipefail
          HOST="kestrelridgehealth.com"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only HEAD~1 HEAD > /tmp/changed_files.txt
          else
            git ls-files > /tmp/changed_files.txt
          fi

          echo "--- Changed files in this push ---"
          cat /tmp/changed_files.txt
          echo "---"

          python3 .github/scripts/indexnow_changed_urls.py "$HOST" \
            < /tmp/changed_files.txt > /tmp/urls.json

          URL_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/urls.json'))))")

          echo "--- URLs to submit: $URL_COUNT ---"
          python3 -c "import json; [print('  ' + u) for u in json.load(open('/tmp/urls.json'))]"

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "No content changes detected -- skipping IndexNow submission ($TIMESTAMP)"
            exit 0
          fi

          python3 .github/scripts/indexnow_build_payload.py \
            "$HOST" "$INDEXNOW_KEY" "$KEY_LOCATION" \
            < /tmp/urls.json > /tmp/payload.json

          echo "Submitting $URL_COUNT URL(s) to IndexNow at $TIMESTAMP"
          HTTP_STATUS=$(curl -sS -o /tmp/indexnow_response.json -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @/tmp/payload.json)

          echo "IndexNow HTTP response: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/indexnow_response.json || true
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "SUCCESS: IndexNow accepted $URL_COUNT URL(s) ($TIMESTAMP)"
          else
            echo "WARNING: IndexNow returned $HTTP_STATUS -- check response above"
            exit 1
          fi
