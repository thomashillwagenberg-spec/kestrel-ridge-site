name: Lighthouse CI

# Runs on every push to main and weekly on Monday.
# Catches performance, accessibility, and SEO regressions without paid tools.
# Results are posted as a job summary — no external service required.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse against live site (mobile)
        run: |
          lhci collect \
            --url="https://kestrelridgehealth.com/" \
            --url="https://kestrelridgehealth.com/product/" \
            --url="https://kestrelridgehealth.com/pilot/" \
            --url="https://kestrelridgehealth.com/evidence/" \
            --numberOfRuns=1 \
            --settings.formFactor=mobile \
            --settings.screenEmulation.mobile \
            --settings.screenEmulation.width=412 \
            --settings.screenEmulation.height=823 \
            --settings.screenEmulation.deviceScaleFactor=2.625 \
            --settings.throttlingMethod=simulate \
            --settings.onlyCategories="performance,accessibility,best-practices,seo" 2>&1 | tail -30
          echo "--- .lighthouseci contents ---"
          ls -la .lighthouseci/ 2>/dev/null || echo "no .lighthouseci dir"

      - name: Parse, report, and enforce score gates
        run: |
          python3 << 'PY'
          import json, glob, os, sys

          report_files = glob.glob('.lighthouseci/lhr-*.json')

          if not report_files:
              print("No report files found in .lighthouseci/ — lhci collect may have failed")
              sys.exit(1)

          # Required gates (mobile). A page below ANY threshold fails the job -
          # this workflow previously only printed a warning emoji and always
          # exited 0, so low scores never actually blocked anything.
          GATES = {'performance': 90, 'accessibility': 95, 'best-practices': 95, 'seo': 95}

          summary_lines = ['## Lighthouse Results (mobile)\n', '| Page | Perf | Access | Best Prac | SEO |', '|------|------|--------|-----------|-----|']
          all_ok = True
          failures = []

          for rf in sorted(report_files):
              with open(rf) as f:
                  r = json.load(f)
              url = r.get('finalUrl','?')
              cats = r.get('categories', {})
              scores = {
                  'performance': int(cats.get('performance',{}).get('score',0)*100),
                  'accessibility': int(cats.get('accessibility',{}).get('score',0)*100),
                  'best-practices': int(cats.get('best-practices',{}).get('score',0)*100),
                  'seo': int(cats.get('seo',{}).get('score',0)*100),
              }
              slug = url.replace('https://kestrelridgehealth.com','') or '/'
              page_failed = [cat for cat, gate in GATES.items() if scores[cat] < gate]
              flag = '' if not page_failed else ' ❌'
              summary_lines.append(f"| {slug}{flag} | {scores['performance']} | {scores['accessibility']} | {scores['best-practices']} | {scores['seo']} |")
              if page_failed:
                  all_ok = False
                  failures.append(f"{slug}: " + ", ".join(f"{c}={scores[c]} (needs >= {GATES[c]})" for c in page_failed))

          summary_lines.append('')
          summary_lines.append(f"> Required gates (mobile): Performance >= {GATES['performance']}, Accessibility >= {GATES['accessibility']}, Best Practices >= {GATES['best-practices']}, SEO >= {GATES['seo']}")

          summary = '\n'.join(summary_lines)
          print(summary)

          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(summary + '\n')

          if not all_ok:
              print('\n❌ FAILING BUILD — one or more pages below required threshold:')
              for line in failures:
                  print('  - ' + line)
              sys.exit(1)

          print('\n✅ All pages meet required thresholds.')
          PY

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 30
