# KRH contact intake Worker — Resend API delivery
name = "krh-contact-inquiries"
main = "src/worker.mjs"
compatibility_date = "2026-10-13"

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY   — required for email delivery (get at resend.com, free tier)
#   TURNSTILE_SECRET — optional; skip for staging, required before public launch
#   DOMAIN_VERIFIED  — set to any non-empty value once kestrelridgehealth.com is
#                      verified in Resend dashboard (enables branded from: address)

# Rate limiting (NOT YET CREATED - requires approval):
#   1. wrangler kv namespace create RATE_LIMIT_KV
#   2. Uncomment the [[kv_namespaces]] block below with the returned id
#   3. Redeploy
# Until this binding exists, the Worker fails open (logs a warning, does not
# block) rather than refusing all traffic - see checkRateLimit() in worker.mjs.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_ID_FROM_WRANGLER_KV_NAMESPACE_CREATE"

# No send_email binding required — Resend API handles delivery without Email Routing.
